name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: 0.15.1

      - name: Validate version and examples
        shell: bash
        run: |
          set -euo pipefail
          package_version=$(sed -nE 's/^version[[:space:]]*=[[:space:]]*"([^"]+)"/\1/p' typst.toml)
          test "$package_version" = "$GITHUB_REF_NAME"
          typst compile example_single.typ /tmp/cv-single.pdf
          typst compile example_double.typ /tmp/cv-double.pdf
          typst compile example_photo_styles.typ /tmp/cv-photo.pdf
          typst compile --root . tests/header-overflow.typ /tmp/cv-header.pdf
          typst compile --root . --input mode=inline --input long=true --input icons=true --input count=3 tests/header-overflow.typ /tmp/cv-header-long.pdf
          typst compile --root . --input mode=rail --input long=true --input icons=true --input count=3 tests/header-overflow.typ /tmp/cv-header-rail.pdf
          typst compile --root . legacy/example-single-legacy.typ /tmp/cv-single-legacy.pdf
          typst compile --root . legacy/example-double-legacy.typ /tmp/cv-double-legacy.pdf
          typst compile --root . legacy/coverletter-legacy.typ /tmp/coverletter-legacy.pdf

      - name: Build release archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/modernpro-cv/template
          mkdir -p dist/modernpro-cv-legacy

          cp modernpro-cv.typ typst.toml README.md CHANGELOG.md LICENSE thumbnail.png dist/modernpro-cv/
          cp -R template/. dist/modernpro-cv/template/

          cp \
            legacy/modernpro-cv-legacy.typ \
            legacy/coverletter-legacy.typ \
            legacy/example-single-legacy.typ \
            legacy/example-double-legacy.typ \
            legacy/bib.bib \
            dist/modernpro-cv-legacy/

          (
            cd dist
            zip -r "modernpro-cv-${GITHUB_REF_NAME}.zip" modernpro-cv
            zip -r "modernpro-cv-legacy-${GITHUB_REF_NAME}.zip" modernpro-cv-legacy
          )

      - name: Extract release notes
        shell: bash
        run: |
          set -euo pipefail
          awk -v version="$GITHUB_REF_NAME" '
            index($0, "## [" version "]") == 1 { capture = 1 }
            capture && printed && index($0, "## [") == 1 { exit }
            capture { print; printed = 1 }
            END { if (!capture) exit 1 }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/modernpro-cv-${GITHUB_REF_NAME}.zip" \
            "dist/modernpro-cv-legacy-${GITHUB_REF_NAME}.zip" \
            modernpro-cv.typ \
            template/cv-single.typ \
            template/cv-double.typ \
            --verify-tag \
            --title "modernpro-cv ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md
